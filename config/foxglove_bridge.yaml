# config/foxglove_bridge.yaml
foxglove_bridge:
  ros__parameters:
    port: 8765
    address: "0.0.0.0"
    

    
    best_effort_qos_topic_whitelist:
      - /camera/*
      
    # QoS queue depths: keep these tiny so ROS never buffers more than a handful of messages
    min_qos_depth: 1
    max_qos_depth: 3
    
    # Drop old outgoing messages quickly (524288 = 0.5 MB buffer, 10485760= 10 MB)
    send_buffer_limit: 1048576
    # Compression
    use_compression: true
    
    # (Optional – leave at defaults or tweak as needed)
    # tls: false
    # use_sim_time: false
    # num_threads: 0
